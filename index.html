<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-title" content="PB PUBLIC">
<title>PB Public V10</title>
<style>
/* Nutze hier dein komplettes CSS aus V9.0 */
:root {
  --bg:#080808; --sur:#121212; --acc:#00d4ff; /* Blau für Public-Abgrenzung */
  --tx:#f0f0f0; --mu:#555; --ok:#00e676; --acc2:#ff3d00; --bor:#2a2a2a;
}
/* ... (Hier dein restliches CSS einfügen) ... */
</style>
</head>
<body>

<header>
  <div class="logo">PB<span style="color:var(--mu);font-size:.55em;"> PUBLIC</span></div>
  <span class="hbadge" id="todayBadge">Setup nötig</span>
</header>

<div class="tabs">
  <button class="tab active" onclick="showTab('workout',this)">Training</button>
  <button class="tab" onclick="showTab('setup',this)">Setup</button>
  <button class="tab" onclick="showTab('records',this)">PRs</button>
</div>

<main>
  <!-- Trainings-Tab -->
  <div class="sec active" id="tab-workout">
    <div id="setupNotice" style="padding:20px; text-align:center; color:var(--mu);">
      <p>Kein Plan geladen.</p>
      <button class="url-save-btn" onclick="showTab('setup', document.querySelectorAll('.tab')[1])">Zum Setup</button>
    </div>
    <div id="workoutUI" style="display:none;">
      <div class="sel-row"><div id="cycleSelRow"></div></div>
      <div class="sel-row"><div id="weekSelRow"></div></div>
      <div class="cinfo" id="cinfo"></div>
      <div class="sel-row" id="daySelRow"></div>
      <div id="workoutContent"></div>
    </div>
  </div>

  <!-- Setup-Tab -->
  <div class="sec" id="tab-setup">
    <div class="setup-step">
      <div class="step-num">4</div>
      <div class="step-title">API & Plan-Sync</div>
      <input class="url-input" id="apiUrlInput" type="url" placeholder="https://script.google.com/macros/s/.../exec">
      <button class="url-save-btn" onclick="saveApiUrl()">1. URL Speichern</button>
      <button class="test-btn" style="background:var(--ok); color:#000; font-weight:bold; margin-top:10px; width:100%;" onclick="syncStructure()">
        2. Trainingsplan vom Sheet laden
      </button>
    </div>
  </div>
</main>

<script>
const SK = 'pb_public_v10'; // Separater Speicher für iPhone-Trennung
let store = JSON.parse(localStorage.getItem(SK) || '{}');
let PLAN = store._plan || [];
let C=0, W=0, D=0;

// PLAN-STRUKTUR VOM SHEET LADEN
async function syncStructure() {
    const url = store._apiUrl;
    if (!url) return alert("Bitte zuerst die API-URL speichern!");
    
    try {
        const resp = await fetch(url + '?action=getPlan&sheet=ZYKLUS MASTER');
        const data = await resp.json();
        
        // Transformiert das 22-Spalten-Raster in die App-Navigation
        PLAN = transformSheetToPlan(data);
        store._plan = PLAN;
        localStorage.setItem(SK, JSON.stringify(store));
        
        alert("✅ Struktur geladen! " + PLAN[0].weeks.length + " Wochen erkannt.");
        location.reload();
    } catch (e) {
        alert("Fehler: " + e.message);
    }
}

function transformSheetToPlan(rows) {
    let cycles = [{ weeks: [] }];
    let currentWeek = null;

    rows.forEach(row => {
        const wStr = String(row[0]).trim(); // Spalte A: Woche[cite: 1]
        const tStr = String(row[3]).trim(); // Spalte D: Tag[cite: 1]
        const exName = String(row[4]).trim(); // Spalte E: Übung[cite: 1]
        const muscle = String(row[5]).trim(); // Spalte F: Muskelgruppe[cite: 1]

        if (wStr.startsWith('Woche')) {
            let wIdx = parseInt(wStr.match(/\d+/)) - 1;
            if (!cycles[0].weeks[wIdx]) cycles[0].weeks[wIdx] = { weekLabel: wStr, days: [] };
            currentWeek = cycles[0].weeks[wIdx];
        }
        if (tStr.startsWith('TAG') && currentWeek) {
            currentWeek.days.push({ date: String(row[1]).trim(), tag: tStr, muscle: muscle || 'Kraft', exercises: [] });
        }
        if (exName && exName !== '—' && currentWeek && currentWeek.days.length > 0) {
            currentWeek.days[currentWeek.days.length - 1].exercises.push(exName);
        }
    });
    return cycles;
}

function saveApiUrl() {
    store._apiUrl = document.getElementById('apiUrlInput').value.trim();
    localStorage.setItem(SK, JSON.stringify(store));
    alert("URL gespeichert.");
}

// Initialisierung
function init() {
    if (PLAN.length > 0) {
        document.getElementById('setupNotice').style.display = 'none';
        document.getElementById('workoutUI').style.display = 'block';
        // Hier folgen deine Standard-Render-Funktionen aus V9.0
    }
}
window.onload = init;
</script>
</body>
</html>
