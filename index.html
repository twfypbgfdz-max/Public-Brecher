<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PB Public V10</title>
    <style>
        :root {
            --bg: #080808; --sur: #121212; --acc: #00d4ff; --tx: #f0f0f0; --ok: #00e676;
        }
        body { background: var(--bg); color: var(--tx); font-family: sans-serif; padding: 20px; margin: 0; }
        .exercise-card { 
            background: var(--sur); border-radius: 12px; padding: 16px; margin-bottom: 15px; 
            border: 1px solid #2a2a2a; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .exercise-title { color: var(--acc); font-weight: bold; font-size: 1.1rem; }
        .muscle-group { color: #888; font-size: 0.8rem; text-transform: uppercase; }
        .input-row { display: flex; gap: 8px; }
        input { 
            background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 8px; 
            padding: 12px; width: 30%; text-align: center; font-size: 1rem;
        }
        .save-btn { 
            background: var(--ok); color: black; border: none; border-radius: 8px; 
            padding: 12px; flex-grow: 1; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>
    <h2 style="text-align: center; margin-bottom: 20px;">PB <span style="color: var(--acc)">PUBLIC</span></h2>
    <div id="exercise-list">Lade Plan aus Sheet...</div>

    <script>
        const API_URL = "DEINE_URL_HIER"; // <--- DEINE WEB-APP URL EINTRAGEN
        const SHEET_NAME = "ZYKLUS MASTER";

        async function loadPlan() {
            try {
                const resp = await fetch(`${API_URL}?sheet=${encodeURIComponent(SHEET_NAME)}&nocache=${Date.now()}`);
                const rows = await resp.json();
                render(rows);
            } catch (e) { document.getElementById('exercise-list').innerText = "Fehler: " + e; }
        }

        function render(rows) {
            const list = document.getElementById('exercise-list');
            list.innerHTML = "";
            rows.slice(3).forEach((row, index) => {
                if (!row[4]) return; 
                const div = document.createElement('div');
                div.className = 'exercise-card';
                div.innerHTML = `
                    <div class="header-row">
                        <span class="exercise-title">${row[4]}</span>
                        <span class="muscle-group">${row[5] || ''}</span>
                    </div>
                    <div class="input-row">
                        <input type="number" placeholder="kg" id="kg-${index}" value="${row[2] || ''}">
                        <input type="number" placeholder="Reps" id="reps-${index}">
                        <button class="save-btn" id="btn-${index}" onclick="save(${index}, '${row[4]}')">Sichern</button>
                    </div>`;
                list.appendChild(div);
            });
        }

        async function save(id, uebung) {
            const btn = document.getElementById(`btn-${id}`);
            const kg = document.getElementById(`kg-${id}`).value;
            const reps = document.getElementById(`reps-${id}`).value;
            btn.innerText = "...";
            
            const payload = {
                sheet: SHEET_NAME,
                date: new Date().toLocaleDateString('de-DE', {day:'2.digit', month:'2.digit'}) + ".",
                uebung: uebung, g1: kg, r1: reps
            };

            try {
                const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
                const res = await r.json();
                if (res.success) { 
                    btn.innerText = "OK!"; btn.style.background = "#00c853"; 
                }
            } catch (e) { alert("Fehler!"); btn.innerText = "Error"; }
        }
        loadPlan();
    </script>
</body>
</html>
