<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-title" content="PB PUBLIC">
<title>PB Public V10</title>
<style>
/* Hier ist dein CSS für das iPhone-Design */
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600&display=swap');
:root {
  --bg: #080808; --sur: #121212; --sur2: #181818; --bor: #2a2a2a;
  --acc: #00d4ff; /* Blau für Public */
  --tx: #f0f0f0; --tx2: #a0a0a0; --mu: #555; --ok: #00e676;
  --r: 8px; --safe-top: env(safe-area-inset-top); --safe-bottom: env(safe-area-inset-bottom);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--tx); font-family: 'Inter', sans-serif; padding-top: var(--safe-top); padding-bottom: 80px; }
header { padding: 12px 16px; border-bottom: 1px solid var(--bor); display: flex; align-items: center; justify-content: space-between; background: rgba(8,8,8,.95); position: sticky; top: 0; z-index: 100; }
.logo { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 3px; color: var(--acc); }
.tabs { display: flex; border-bottom: 1px solid var(--bor); background: var(--sur); position: sticky; top: 57px; z-index: 99; }
.tab { padding: 12px 14px; cursor: pointer; color: var(--mu); border: none; background: none; font-family: 'Space Mono'; font-size: 9px; text-transform: uppercase; flex: 1; }
.tab.active { color: var(--acc); border-bottom: 2px solid var(--acc); }
main { padding: 16px; max-width: 600px; margin: 0 auto; }
.sec { display: none; } .sec.active { display: block; }
.setup-step { background: var(--sur); border: 1px solid var(--bor); padding: 20px; border-radius: var(--r); margin-bottom: 15px; }
.url-input { width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--bor); color: #fff; border-radius: 4px; margin-bottom: 10px; font-size: 12px; }
.btn { width: 100%; padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-family: 'Bebas Neue'; letter-spacing: 1px; }
/* Workout-Elemente */
.excard { background: var(--sur); border: 1px solid var(--bor); margin-bottom: 10px; border-radius: var(--r); padding: 12px; }
.exname { font-size: 14px; font-weight: 600; margin-bottom: 10px; color: var(--acc); }
.sets-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.sinput { background: var(--sur2); border: 1px solid var(--bor); color: #fff; padding: 8px; border-radius: 4px; text-align: center; }
</style>
</head>
<body>

<header>
  <div class="logo">PB<span style="color:var(--mu);font-size:.55em;"> PUBLIC</span></div>
  <div id="status">Bereit</div>
</header>

<div class="tabs">
  <button class="tab active" onclick="showTab('workout', this)">Training</button>
  <button class="tab" onclick="showTab('setup', this)">Setup</button>
</div>

<main>
  <div class="sec active" id="tab-workout">
    <div id="noPlan" style="text-align:center; padding:40px;">
      <p style="color:var(--mu);">Kein Plan geladen.</p>
      <button class="btn" style="background:var(--acc); margin-top:20px;" onclick="showTab('setup', document.querySelectorAll('.tab')[1])">Zum Setup</button>
    </div>
    <div id="workoutUI" style="display:none;">
       <div id="workoutContent"></div>
    </div>
  </div>

  <div class="sec" id="tab-setup">
    <div class="setup-step">
      <p style="margin-bottom:10px; font-size:12px;">1. API-URL aus Google Sheet:</p>
      <input class="url-input" id="apiUrl" type="url" placeholder="https://script.google.com/...">
      <button class="btn" style="background:var(--acc);" onclick="saveSetup()">Speichern & Plan laden</button>
    </div>
  </div>
</main>

<script>
const SK = 'pb_public_v10';
let store = JSON.parse(localStorage.getItem(SK) || '{"url":"","plan":[]}');

function showTab(id, btn) {
  document.querySelectorAll('.sec').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  btn.classList.add('active');
}

async function saveSetup() {
  const url = document.getElementById('apiUrl').value.trim();
  if(!url) return alert("URL fehlt!");
  store.url = url;
  
  document.getElementById('status').innerText = "Lädt...";
  try {
    const resp = await fetch(url + '?action=getPlan&sheet=ZYKLUS MASTER');
    const data = await resp.json();
    store.plan = data;
    localStorage.setItem(SK, JSON.stringify(store));
    alert("Plan geladen!");
    location.reload();
  } catch(e) { alert("Fehler: " + e.message); }
}

function renderWorkout() {
  const cont = document.getElementById('workoutContent');
  if(!store.plan || store.plan.length === 0) return;
  
  document.getElementById('noPlan').style.display = 'none';
  document.getElementById('workoutUI').style.display = 'block';
  
  let html = '';
  // Wir zeigen hier beispielhaft die ersten 10 Zeilen des Plans
  store.plan.slice(0, 20).forEach((row, i) => {
    if(row[4] && row[4] !== 'Übung' && row[4] !== '—') {
      html += `<div class="excard">
        <div class="exname">${row[4]}</div>
        <div class="sets-grid">
          <input class="sinput" placeholder="kg" id="kg-${i}">
          <input class="sinput" placeholder="Reps" id="r1-${i}">
          <button class="btn" style="background:var(--ok); padding:4px;" onclick="saveEx(${i}, '${row[4]}')">Sichern</button>
        </div>
      </div>`;
    }
  });
  cont.innerHTML = html;
}

async function saveEx(idx, name) {
  const kg = document.getElementById('kg-'+idx).value;
  const reps = document.getElementById('r1-'+idx).value;
  // Hier würde der Bulk-POST an dein code.gs gehen
  alert(`${name} gesichert! (V10 API ready)`);
}

window.onload = () => {
  if(store.url) document.getElementById('apiUrl').value = store.url;
  renderWorkout();
};
</script>
</body>
</html>
