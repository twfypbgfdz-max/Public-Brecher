<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>PB V8.0 PRO</title>
    <style>
        :root {
            --bg: #050505;
            --card: #121212;
            --border: #1c1c1c;
            --accent: #ccff00; /* Neon-Lime */
            --text: #ffffff;
            --text-dim: #888888;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, system-ui, sans-serif;
            margin: 0;
            padding: 15px;
            -webkit-font-smoothing: antialiased;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-top: 5px;
        }

        .logo { font-weight: 900; letter-spacing: -1px; font-size: 1.2rem; }
        .logo span { color: var(--accent); }

        .setup-trigger {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: bold;
        }

        /* Navigation (Trainingstage) */
        .nav-bar {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 15px;
            margin-bottom: 20px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .nav-bar::-webkit-scrollbar { display: none; }

        .nav-btn {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            min-width: 85px;
            padding: 12px;
            text-align: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .nav-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
        }

        .nav-btn span { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; }

        /* Übungskarten */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }

        .ex-title {
            color: var(--accent);
            font-weight: 800;
            font-size: 1rem;
            margin: 0 0 15px 0;
            display: inline-block;
            border-bottom: 1px dashed #333;
            padding-bottom: 3px;
        }

        .set-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 12px;
        }

        .set-label {
            font-size: 0.6rem;
            color: #444;
            width: 40px;
            font-weight: 900;
            text-transform: uppercase;
        }

        input {
            background: #000;
            border: 1px solid #222;
            color: white;
            padding: 12px;
            border-radius: 10px;
            width: 35%;
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus { border-color: var(--accent); }

        .save-btn {
            background: #1a1a1a;
            color: var(--text-dim);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            width: 100%;
            font-weight: 900;
            font-size: 0.8rem;
            text-transform: uppercase;
            margin-top: 10px;
            cursor: pointer;
        }

        .save-btn.ready {
            background: var(--accent);
            color: #000;
            border: none;
        }

        #loader { text-align: center; padding: 50px; color: var(--text-dim); font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">PB <span>V8.0</span></div>
        <button class="setup-trigger" onclick="handleSetup()">⚙️ Plan</button>
    </div>

    <div id="nav" class="nav-bar"></div>
    <div id="exercise-list"><div id="loader">Lade Trainingsplan...</div></div>

    <script>
        // Deine aktuelle Web-App URL
        const API = "https://script.google.com/macros/s/AKfycbw2SPaQwUbVln23N83rOJqSr4Fukt2jnJlpXa4qGbVWFK-0_5k0hJ7ZVQaOXLx9LlYx9A/exec";
        
        let activeSheet = localStorage.getItem('pb_sheet_name') || "ZYKLUS MASTER";
        let rawData = [];

        function handleSetup() {
            const name = prompt("Name deines Tabellenblatts (exakt wie im Sheet):", activeSheet);
            if (name) {
                localStorage.setItem('pb_sheet_name', name.trim());
                location.reload();
            }
        }

        async function init() {
            try {
                const response = await fetch(`${API}?sheet=${encodeURIComponent(activeSheet)}&v=${Date.now()}`);
                rawData = await response.json();
                renderNav();
            } catch (e) {
                document.getElementById('loader').innerText = "Fehler: Verbindung zum Sheet fehlgeschlagen.";
            }
        }

        function renderNav() {
            const nav = document.getElementById('nav');
            nav.innerHTML = "";
            const sections = [];

            // Erstellt Navigation anhand der Trainingstage in Spalte D
            rawData.forEach((row, i) => {
                if (row[3] && row[3].trim() !== "") {
                    sections.push({ name: row[3], index: i + 3 });
                }
            });

            sections.forEach((sec, idx) => {
                const btn = document.createElement('div');
                btn.className = `nav-btn ${idx === 0 ? 'active' : ''}`;
                btn.innerHTML = `<span>${sec.name}</span>`;
                btn.onclick = () => {
                    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderExercises(sec.name);
                };
                nav.appendChild(btn);
            });

            if (sections.length > 0) renderExercises(sections[0].name);
        }

        function renderExercises(dayName) {
            const list = document.getElementById('exercise-list');
            list.innerHTML = "";
            let isTarget = false;

            rawData.forEach((row, i) => {
                const rowIdx = i + 3; // Wichtig für die korrekte Zeile im Sheet
                
                // Prüft, ob die aktuelle Zeile zum gewählten Tag gehört
                if (row[3] && row[3] !== "") isTarget = (row[3] === dayName);

                if (isTarget && row[4]) {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <h3 class="ex-title" onclick="quickRename(${rowIdx}, '${row[4]}')">${row[4]} ✏️</h3>
                        ${[1, 2, 3].map(s => `
                            <div class="set-row">
                                <span class="set-label">SATZ ${s}</span>
                                <input type="number" step="0.5" inputmode="decimal" placeholder="kg" id="g${s}-${rowIdx}" value="${row[6 + (s-1)*2] || ''}">
                                <input type="number" inputmode="numeric" placeholder="Wdh" id="r${s}-${rowIdx}" value="${row[7 + (s-1)*2] || ''}">
                            </div>
                        `).join('')}
                        <button class="save-btn ready" id="btn-${rowIdx}" onclick="saveData(${rowIdx}, '${row[4]}')">Sichern</button>
                    `;
                    list.appendChild(card);
                }
            });
        }

        async function quickRename(idx, oldName) {
            const newName = prompt("Übung umbenennen:", oldName);
            if (newName && newName !== oldName) {
                const payload = { sheet: activeSheet, rowIdx: idx, action: "rename", newName: newName };
                await fetch(API, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
                alert("Erfolgreich umbenannt!");
                location.reload();
            }
        }

        async function saveData(idx, title) {
            const btn = document.getElementById(`btn-${idx}`);
            btn.innerText = "SENDET...";
            btn.disabled = true;

            // Datum automatisch generieren
            const today = new Date().toLocaleDateString('de-DE', {day:'2.digit', month:'2.digit'}) + ".";

            const payload = {
                sheet: activeSheet,
                rowIdx: idx,
                date: today,
                uebung: title,
                g1: document.getElementById(`g1-${idx}`).value, r1: document.getElementById(`r1-${idx}`).value,
                g2: document.getElementById(`g2-${idx}`).value, r2: document.getElementById(`r2-${idx}`).value,
                g3: document.getElementById(`g3-${idx}`).value, r3: document.getElementById(`r3-${idx}`).value
            };

            try {
                await fetch(API, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
                btn.innerText = "GESICHERT";
                btn.style.background = "#00c853";
                setTimeout(() => {
                    btn.innerText = "SICHERN";
                    btn.style.background = "";
                    btn.disabled = false;
                }, 2000);
            } catch (e) {
                btn.innerText = "FEHLER";
                btn.disabled = false;
            }
        }

        init();
    </script>
</body>
</html>
