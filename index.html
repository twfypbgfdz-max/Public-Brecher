<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PB V8.0 PUBLIC</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Inter:wght@300;400;600&display=swap');
        
        :root {
            --bg: #080808; --sur: #121212; --bor: #2a2a2a; --acc: #c8ff00; --tx: #f0f0f0; --mu: #555;
        }

        body {
            background: var(--bg); color: var(--tx); font-family: 'Inter', sans-serif;
            margin: 0; padding-bottom: 110px; -webkit-font-smoothing: antialiased;
        }

        /* Header wie in der Profi-App */
        header {
            padding: 12px 16px; border-bottom: 1px solid var(--bor);
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(8,8,8,.95); backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 100;
        }

        .logo { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 2px; color: var(--acc); }
        .logo span { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--mu); margin-left: 5px; }

        /* Vitaldaten Boxen */
        .info-row { display: flex; gap: 8px; padding: 15px; }
        .bw-box { background: var(--sur); border: 1px solid var(--bor); padding: 12px; flex: 1; border-radius: 8px; }
        .box-lbl { font-family: 'Space Mono', monospace; font-size: 8px; color: var(--mu); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .bw-input { background: transparent; border: none; border-bottom: 1px solid var(--bor); color: #fff; font-family: 'Space Mono', monospace; font-size: 16px; width: 100%; outline: none; }

        /* Navigation[cite: 2] */
        .day-nav { display: flex; gap: 8px; overflow-x: auto; padding: 0 15px 15px; scrollbar-width: none; }
        .day-btn { background: var(--sur); border: 1px solid var(--bor); border-radius: 8px; padding: 10px; min-width: 80px; text-align: center; flex-shrink: 0; cursor: pointer; }
        .day-btn.active { background: var(--acc); color: #000; border-color: var(--acc); font-weight: 700; }
        .day-btn span { font-family: 'Space Mono', monospace; font-size: 8px; display: block; opacity: 0.6; }

        /* Training View[cite: 2] */
        .view { display: none; padding: 0 15px; }
        .view.active { display: block; }
        .card { background: var(--sur); border: 1px solid var(--bor); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
        .ex-title { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: var(--tx); letter-spacing: 1px; margin-bottom: 12px; }
        
        .sets-grid { display: grid; grid-template-columns: 45px 1fr 1fr; gap: 8px; align-items: center; margin-bottom: 10px; }
        .slbl { font-family: 'Space Mono', monospace; font-size: 8px; color: var(--mu); }
        .sinput { background: #000; border: 1px solid var(--bor); color: #fff; padding: 10px; border-radius: 6px; text-align: center; font-family: 'Space Mono', monospace; font-weight: bold; width: 100%; box-sizing: border-box; outline: none; }
        .sinput:focus { border-color: var(--acc); }

        /* Planung View[cite: 2] */
        .edit-item { background: var(--sur); border: 1px solid var(--bor); padding: 12px; margin-bottom: 8px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
        .edit-name { font-size: 13px; font-weight: 600; }
        .edit-btn { background: #222; border: 1px solid #333; color: var(--acc); padding: 6px 12px; border-radius: 6px; font-family: 'Space Mono'; font-size: 10px; font-weight: bold; }

        /* Fixed Bottom Tab Bar[cite: 2] */
        .tab-bar { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid var(--bor); display: flex; justify-content: space-around; padding: 10px 0 env(safe-area-inset-bottom); z-index: 1000; }
        .tab-item { color: var(--mu); font-family: 'Space Mono', monospace; font-size: 9px; text-transform: uppercase; text-align: center; flex: 1; }
        .tab-item.active { color: var(--acc); }
        .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

        /* Save Button[cite: 2] */
        .footer-save { position: fixed; bottom: 75px; left: 15px; right: 15px; z-index: 999; }
        .save-btn { background: var(--acc); color: #000; border: none; border-radius: 12px; padding: 16px; width: 100%; font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 2px; font-weight: bold; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

<header>
    <div class="logo">PB<span>V8.0</span></div>
    <div style="font-family:'Space Mono'; font-size:9px; color:var(--mu);" id="header-date"></div>
    <button onclick="handleSetup()" style="background:none; border:none; color:var(--mu); font-size:14px;">⚙️</button>
</header>

<div class="info-row">
    <div class="bw-box">
        <div class="box-lbl">Körpergewicht</div>
        <div style="display:flex; align-items:baseline;"><input class="bw-input" type="number" step="0.1" id="bwInput" placeholder="0.0"><span style="color:var(--mu); font-size:10px; margin-left:4px;">kg</span></div>
    </div>
    <div class="bw-box">
        <div class="box-lbl">Training Stats</div>
        <div style="display:flex; gap:8px;">
            <input class="bw-input" style="width:35px; font-size:12px;" type="number" id="kcalIn" placeholder="kcal">
            <input class="bw-input" style="width:30px; font-size:12px;" type="number" id="bpmIn" placeholder="bpm">
            <input class="bw-input" style="width:30px; font-size:12px;" type="number" id="minIn" placeholder="min">
        </div>
    </div>
</div>

<div id="day-nav" class="day-nav"></div>

<div id="view-training" class="view active">
    <div id="training-list">Lade Übungen...</div>
    <div class="footer-save">
        <button class="save-btn" id="master-save" onclick="saveAll()">In Google Sheet speichern</button>
    </div>
</div>

<div id="view-plan" class="view">
    <div id="plan-list"></div>
</div>

<div class="tab-bar">
    <div class="tab-item active" onclick="switchTab('training')"><span class="tab-icon">🏋️</span>Training</div>
    <div class="tab-item" onclick="switchTab('plan')"><span class="tab-icon">📝</span>Planung</div>
</div>

<script>
    const API = "https://script.google.com/macros/s/AKfycbxfE1I5oBT07_zaeic83nIhrpHiRWK84j0BXOhtyNttwMqFOAIww65WhhZQaKltrRaqIA/exec";
    let activeSheet = localStorage.getItem('pb_sheet_name') || "ZYKLUS MASTER";
    let rawData = [];
    let currentDayName = "";

    document.getElementById('header-date').innerText = new Date().toLocaleDateString('de-DE', {day:'2.digit', month:'short'});

    async function init() {
        try {
            // CORS-Fix: Standard-GET ohne 'no-cors'[cite: 2]
            const response = await fetch(`${API}?sheet=${encodeURIComponent(activeSheet)}&v=${Date.now()}`);
            rawData = await response.json();
            renderNav();
        } catch (e) {
            document.getElementById('training-list').innerText = "Fehler beim Laden!";
        }
    }

    function renderNav() {
        const nav = document.getElementById('day-nav');
        nav.innerHTML = "";
        const days = [];
        rawData.forEach((row, i) => { if (row[3]) days.push({ name: row[3] }); });
        
        days.forEach((d, i) => {
            const b = document.createElement('div');
            b.className = `day-btn ${i === 0 ? 'active' : ''}`;
            b.innerHTML = `<span>Tag</span>${d.name}`;
            b.onclick = () => {
                document.querySelectorAll('.day-btn').forEach(x => x.classList.remove('active'));
                b.classList.add('active');
                currentDayName = d.name;
                renderContent();
            };
            nav.appendChild(b);
        });
        if(days.length > 0) { currentDayName = days[0].name; renderContent(); }
    }

    function renderContent() {
        const tList = document.getElementById('training-list');
        const pList = document.getElementById('plan-list');
        tList.innerHTML = ""; pList.innerHTML = "";
        let isD = false;

        rawData.forEach((row, i) => {
            const rIdx = i + 3;
            if(row[3]) isD = (row[3] === currentDayName);
            if(isD && row[4]) {
                const isNamed = row[4] !== "Übung eintragen...";
                
                // Planung Ansicht[cite: 2]
                const pItem = document.createElement('div');
                pItem.className = 'edit-item';
                pItem.innerHTML = `<span class="edit-name">${row[4]}</span><button class="edit-btn" onclick="rename(${rIdx}, '${row[4]}')">EDIT</button>`;
                pList.appendChild(pItem);

                // Trainings Ansicht[cite: 2]
                if(isNamed) {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.setAttribute('data-idx', rIdx);
                    card.setAttribute('data-title', row[4]);
                    card.innerHTML = `<div class="ex-title">${row[4]}</div>
                        ${[1, 2, 3].map(s => `
                            <div class="sets-grid">
                                <div class="slbl">SATZ ${s}</div>
                                <input class="sinput" type="number" step="0.5" id="g${s}-${rIdx}" value="${row[6+(s-1)*2] || ''}" placeholder="kg">
                                <input class="sinput" type="number" id="r${s}-${rIdx}" value="${row[7+(s-1)*2] || ''}" placeholder="Reps">
                            </div>
                        `).join('')}`;
                    tList.appendChild(card);
                }
            }
        });
    }

    async function saveAll() {
        const btn = document.getElementById('master-save');
        const cards = document.querySelectorAll('.card');
        if(cards.length === 0) return;

        btn.innerText = "SICHERE..."; btn.disabled = true;
        const date = new Date().toLocaleDateString('de-DE', {day:'2.digit', month:'2.digit'}) + ".";
        const kg = document.getElementById('bwInput').value;
        const kcal = document.getElementById('kcalIn').value;
        const bpm = document.getElementById('bpmIn').value;
        const dur = document.getElementById('minIn').value;

        for (let card of cards) {
            const idx = card.getAttribute('data-idx');
            const payload = {
                sheet: activeSheet, rowIdx: parseInt(idx), date: date, kg: kg,
                uebung: card.getAttribute('data-title'),
                g1: document.getElementById(`g1-${idx}`).value, r1: document.getElementById(`r1-${idx}`).value,
                g2: document.getElementById(`g2-${idx}`).value, r2: document.getElementById(`r2-${idx}`).value,
                g3: document.getElementById(`g3-${idx}`).value, r3: document.getElementById(`r3-${idx}`).value,
                kcal: kcal, bpm: bpm, duration: dur
            };
            await fetch(API, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
        }
        btn.innerText = "FERTIG!";
        setTimeout(() => { btn.innerText = "In Google Sheet speichern"; btn.disabled = false; }, 2000);
    }

    function switchTab(tab) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
        if (tab === 'training') {
            document.getElementById('view-training').classList.add('active');
            document.querySelectorAll('.tab-item')[0].classList.add('active');
        } else {
            document.getElementById('view-plan').classList.add('active');
            document.querySelectorAll('.tab-item')[1].classList.add('active');
        }
    }

    async function rename(idx, old) {
        const n = prompt("Name der Übung:", old === "Übung eintragen..." ? "" : old);
        if(n) {
            await fetch(API, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ sheet: activeSheet, rowIdx: idx, action: "rename", newName: n }) });
            location.reload();
        }
    }

    function handleSetup() {
        const n = prompt("Sheet Name:", activeSheet);
        if(n) { localStorage.setItem('pb_sheet_name', n.trim()); location.reload(); }
    }

    init();
</script>
</body>
</html>
